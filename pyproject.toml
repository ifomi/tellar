[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tellar"
version = "0.1.0"
description = "Local push-to-talk dictation powered by mlx-whisper"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4",
    "mlx-lm>=0.20",
    "mlx>=0.21",
    "huggingface-hub>=0.20",
    "PyQt6>=6.6",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyaudio>=0.2",
    "numpy>=1.24",
]

[project.scripts]
tellar = "tellar.app:main"

[tool.setuptools.packages.find]
include = ["tellar*"]
